
name: Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "testing/**"
      - "codex/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
